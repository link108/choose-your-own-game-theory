clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      token:
        from_secret: github_token

when:
  branch: main
  event: [push, pull_request]

# Build on the homelab agent, not the Hetzner cluster's own agent - see
# link108/deckforge's .woodpecker.yaml for why.
labels:
  host: homelab

steps:
  - name: backend-checks
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    commands:
      - cd backend
      - uv sync
      - uv run ruff check .
      - uv run pytest

  - name: frontend-build
    image: node:22-alpine
    commands:
      - cd frontend
      - npm ci
      - npm run build

  - name: docker-build
    image: woodpeckerci/plugin-docker-buildx
    when:
      event: push
    settings:
      repo: link108/game-theory-sim
      build_args:
        APPLICATION_VERSION: 0.1.0
        GIT_SHA: ${CI_COMMIT_SHA}
      tags:
        - ${CI_COMMIT_SHA:0:7}
        - latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  - name: request-deploy
    image: alpine:3.19
    when:
      event: push
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache git yq github-cli
      - SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-7)
      - git clone https://x-access-token:$GITHUB_TOKEN@github.com/link108/homelab.git /tmp/homelab
      - cd /tmp/homelab
      - git config user.email "ci@byah.org"
      - git config user.name "Woodpecker CI (game-theory-sim)"
      - git checkout -b "deploy/game-theory-sim-$SHORT_SHA"
      - ./scripts/request-deploy.sh game-theory-sim "$SHORT_SHA"
      - git add -A
      - git commit -m "deploy(game-theory-sim):$SHORT_SHA"
      - git push -u origin "deploy/game-theory-sim-$SHORT_SHA"
      - gh pr create --repo link108/homelab --title "deploy(game-theory-sim):$SHORT_SHA" --body "Auto-deploy from game-theory-sim Woodpecker CI" --head "deploy/game-theory-sim-$SHORT_SHA"
